      - {click: Keyboard_number, long_click: liquid_keyboard_emoji, width: 10, key_back_color: bgn, key_text_color: tgn, swipe_up: liquid_keyboard_emoji, swipe_down: liquid_keyboard_emoji}
      - {long_click: '.', width: 8, key_back_color: bh4, key_text_color: th4, click: ',', swipe_up: '.', swipe_down: '.'}
      - {click: space, long_click: Mode_switch, swipe_left: Left, swipe_right: Right, width: 40, key_back_color: bkg, key_text_color: tkg}
      - {click: Mode_switch, width: 10, key_back_color: bgn, key_text_color: tgn, swipe_up: clipboard_window, swipe_down: clipboard_window, long_click: clipboard_window}
      - {click: Return, popup: '["Settings"]', composing: Return1, swipe_up: Escape, width: 20, key_back_color: benter, key_text_color: tenter}

  number:
    author: "Chh"
    name: 数字+
  #  height: 48
    ascii_mode: 1
    keys:
