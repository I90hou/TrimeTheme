      - {click: m, long_click: '?', swipe_down: '?', swipe_up: '?', key_back_color: bh3, key_text_color: th3}
      - {click: BackSpace2, swipe_up: Clear, width: 15, key_back_color: bbs, key_text_color: tbs}
