# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: Ocean_mist           #方案名称
author: Chh    #作者信息

#键盘高度
height:
  1: &jpgd1 30 #表情键盘
  2: &jpgd2 24 #颜文字键盘1
  3: &jpgd3 24 #颜文字键盘2
  4: &jpgd4 48 #主键盘
  5: &jpgd5 39.5 #符号键盘
  6: &hgap 4 #键盘横缝大小
  7: &sgap 12 #键盘竖缝大小

#圆角
round_corner:
  1: &round1 6 #按键圆角半径
  2: &round2 0 #候选窗口圆角
  3: &round3 12 #回车键圆角

#界面风格、功能开关
style:
  auto_caps: false #自動句首大寫:true|false
  candidate_font: han.ttf  #候选字体
  candidate_padding: 5  #候选项内边距
  candidate_spacing: 0.0  #候选分割线
  candidate_text_size: 23  #候选字号
  candidate_text_vertical_bias: 1.0 #候选文本垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  candidate_view_height: 28 #候选区高度
  comment_font: comment.ttf #编码提示字体
  comment_height: 12 #编码提示区高度（仅 top 模式约束高度，其余模式与 candidate_view_height 无区别）
  comment_position: right #编码提示布局位置：right / top / overlay
  comment_vertical_bias: 0.0 #编码提示垂直偏移位置（仅 overlay 模式使用，需要间隙空间足够，范围 0.0~1.0，0.0=top，0.5=center，1.0=bottom）
  comment_text_size: 10 #编码提示字号
  hanb_font: hanb.ttf #扩充字体
  horizontal_gap: *hgap #键水平间距
  key_font: symbol.ttf #键盘字体
  key_height: *jpgd4 #键高
  key_long_text_size: 16 #长标签字号
  key_text_size: 24 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  label_text_size: 18 #标签字号
  label_font: label.ttf #编标签字体
  latin_font: latin.ttf #西文本体
  keyboard_height: 225 #锁定键盘高度，避免切换时键盘高度变化而造成闪烁
  keyboard_height_land: 200 #锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  popup_font: latin.ttf #按键提示字体
  popup_width: 38 #按键提示宽度
  popup_height: 48 #按键提示高度
  popup_bottom_margin: 68 #按键提示底边距
  popup_key_height: 48 #按键提示内键高度
  popup_text_size: 23 #按键提示字号
  reset_ascii_mode_on_focus_change: false #焦点变更弹起输入法软键盘时，重置 ascii_mode
  round_corner: *round1 #按键圆角半径
  shadow_radius: 0.0 #按键阴影半径（TRIME不支持按键阴影，保留参数占位）
  symbol_font: symbol.ttf #符号字体
  symbol_text_size: 10 #符号字号
  text_font: latin.ttf #编码字体
  vertical_gap: *sgap #键盘行距
  enter_label_mode: 0  #是否使用App提供的ActionLabel内容作为Enter键的文本（由于多数App没有适配ActionLable，实际影响不大）。0不使用，1只使用actionlabel，2优先使用，3当其他方式没有获得label时才读取actionlabel
  enter_labels:  # 定义Enter键的文本
    go: 前往
    done: 完成
    next: 下个
    pre:  上个
    search: 搜索
    send: 发送
    default: Enter   # 定义默认Enter键的文本

preedit:                    # 预编辑文本视图参数
  horizontal_padding: 8     # 横向内边距（整数）
  #  alpha: 0.8             # 透明度（0-1，浮点）
  top_end_radius: 4         # 末上端圆角（浮点）
  foreground:               # 前景样式
    font_size: 16           # 预编辑字体大小（浮点）

window:                     # 候选窗口（悬浮窗）参数
  insets:                   # 窗口内边距
    vertical: 4             # 纵向内边距（整数）
    horizontal: 4           # 横向内边距（整数）
  item_padding:             # 候选项内边距
    #  vertical: 0          # 纵向内边距（整数）
    horizontal: 4           # 横向内边距（整数）
    #  min_width: 0         # 最小宽度（整数）
    #  corner_radius: 0     # 圆角半径（浮点）
    #  border: 0            # 边框宽度（整数）
    #  shadow: 0.0          # 阴影半径（浮点）
    #  alpha: 1             # 透明度（0-1，浮点）
  foreground:               # 前景样式
    label_font_size: 20     # 序号字体大小（浮点）
    text_font_size: 20      # 文字字体大小（浮点）
    comment_font_size: 16   # 注释字体大小（浮点）

# 最好保留一项，防止其他主题使用 __include 时无法加载
fallback_colors:
  candidate_text_color: text_color

#颜色
colors:
  1: &color1 0xff000000
  2: &color2 0xffffffff
  3: &color3 0xffe1e3e7
  4: &color4 0xffacb2c2
  5: &color5 0xff131313
  6: &color6 0xff3266a0
  7: &color7 0x00
  8: &color8 0xff838383

#配色方案
preset_color_schemes:
  OCEAN:
    name: 海雾／Ocean Mist
    author: TRIME Theme
    dark_scheme: OCEAN_DARK            # 关联的暗色方案
    text_color: 0xff3D4F5F           # 编码区文字颜色
    back_color: 0xffEEF2F5           # 候选区背景色
    text_back_color: 0xffEEF2F5      # 编码区背景色（悬浮窗背景）
    border_color: 0xffDEE5EA         # 边框颜色
    candidate_separator_color: 0x00000000 # 候选分割线颜色（透明=隐藏分割线）
    candidate_text_color: 0xff3D4F5F      # 候选文字颜色
    comment_text_color: 0xff8EA0AE        # 编码提示文字颜色（灰色）
    label_color: 0xff8EA0AE               # 标签/序号颜色
    hilited_text_color: 0xff7EA8B8        # 高亮编码文字颜色（蓝色）
    hilited_back_color: 0x00000000        # 高亮编码背景色
    hilited_candidate_text_color: 0xffFFFFFF  # 高亮候选文字颜色（白色）
    hilited_candidate_back_color: 0xff7EA8B8  # 高亮候选背景（蓝色）
    hilited_comment_text_color: 0xffFFFFFF    # 高亮注释文字颜色
    hilited_key_back_color: 0xff7EA8B8        # 高亮按键背景（蓝色）
    hilited_key_text_color: 0xffFFFFFF        # 高亮按键文字（白色）
    hilited_key_symbol_color: 0xffFFFFFF      # 高亮按键符号色
    hilited_off_key_back_color: 0xffF8FAFB    # 非高亮非当前按键背景
    hilited_off_key_text_color: 0xff3D4F5F    # 非高亮非当前按键文字
    key_back_color: 0xffF8FAFB                # 普通按键背景（白色）
    key_text_color: 0xff3D4F5F                # 普通按键文字（深灰）
    key_symbol_color: 0xff8EA0AE              # 按键符号颜色
    keyboard_back_color: 0xffDEE5EA           # 键盘区背景色（浅灰）
    off_key_back_color: 0xffF8FAFB            # 非当前按键背景
    off_key_text_color: 0xff3D4F5F            # 非当前按键文字
    preview_back_color: 0xff3D4F5F            # 按键预览背景（深色）
    preview_text_color: 0xffFFFFFF            # 按键预览文字（白色）
    shadow_color: 0x00000000                  # 阴影颜色（透明，TRIME不支持按键阴影）
    # 键盘布局引用颜色 —— 以下键名在 preset_keyboards 中被引用
    bgn: 0xffF8FAFB      # 功能键背景（灰色）
    tgn: 0xff3D4F5F      # 功能键文字（深色）
    benter: 0xff7EA8B8   # 回车键背景（蓝色）
    tenter: 0xffFFFFFF   # 回车键文字（白色）
    bkg: 0xffF8FAFB      # 空格键背景（白色）
    tkg: 0xff3D4F5F      # 空格键文字（深色）
    baoe: 0xff7EA8B8     # 元音键背景（蓝色）
    taoe: 0xffFFFFFF     # 元音键文字（白色）
    bbs: 0xffEEF2F5      # 退格/Shift背景（灰色）
    tbs: 0xff3D4F5F      # 退格/Shift文字（深色）
    bh1: 0xffF8FAFB      # 第1行按键背景（白色）
    th1: 0xff3D4F5F      # 第1行按键文字（深色）
    bh2: 0xffF8FAFB      # 第2行按键背景
    th2: 0xff3D4F5F      # 第2行按键文字
    bh3: 0xffF8FAFB      # 第3行按键背景
    th3: 0xff3D4F5F      # 第3行按键文字
    bh4: 0xffF8FAFB      # 第4行按键背景
    th4: 0xff3D4F5F      # 第4行按键文字

  OCEAN_DARK:
    name: OCEAN_DARK／海雾 黑
    author: TRIME Theme
    text_color: 0xffC8D6DF                # 编码区文字（浅色）
    back_color: 0xff283035                # 候选区背景（深灰）
    text_back_color: 0xff283035           # 编码区背景
    border_color: 0xff3D4F5F              # 边框颜色
    candidate_separator_color: 0x00000000 # 候选分割线（透明）
    candidate_text_color: 0xffC8D6DF      # 候选文字（浅灰）
    comment_text_color: 0xff8EA0AE        # 编码提示文字
    label_color: 0xff8EA0AE              # 标签颜色
    hilited_text_color: 0xff8CB7C5       # 高亮编码文字（亮蓝）
    hilited_back_color: 0x00000000       # 高亮编码背景
    hilited_candidate_text_color: 0xffFFFFFF  # 高亮候选文字（白色）
    hilited_candidate_back_color: 0xff8CB7C5  # 高亮候选背景（亮蓝）
    hilited_comment_text_color: 0xffFFFFFF    # 高亮注释文字
    hilited_key_back_color: 0xff8CB7C5        # 高亮按键背景
    hilited_key_text_color: 0xffFFFFFF        # 高亮按键文字
    hilited_key_symbol_color: 0xffFFFFFF      # 高亮按键符号
    hilited_off_key_back_color: 0xff3D4F5F    # 非高亮非当前按键背景
    hilited_off_key_text_color: 0xffC8D6DF    # 非高亮非当前按键文字
    key_back_color: 0xff384048                # 普通按键背景（深灰）
    key_text_color: 0xffC8D6DF                # 普通按键文字（白色）
    key_symbol_color: 0xff8EA0AE              # 按键符号颜色
    keyboard_back_color: 0xff1E262A           # 键盘区背景（暗灰）
    off_key_back_color: 0xff384048            # 非当前按键背景
    off_key_text_color: 0xffC8D6DF            # 非当前按键文字
    preview_back_color: 0xffC8D6DF            # 按键预览背景（浅色）
    preview_text_color: 0xff283035            # 按键预览文字（深色）
    shadow_color: 0x00000000                  # 阴影（透明，TRIME不支持按键阴影）
    # 键盘布局引用颜色
    bgn: 0xff384048      # 功能键背景（暗灰）
    tgn: 0xffC8D6DF      # 功能键文字（白色）
    benter: 0xff8CB7C5   # 回车键背景（亮蓝）
    tenter: 0xffFFFFFF   # 回车键文字（白色）
    bkg: 0xff384048      # 空格键背景（深灰）
    tkg: 0xffC8D6DF      # 空格键文字（白色）
    baoe: 0xff8CB7C5     # 元音键背景（亮蓝）
    taoe: 0xffFFFFFF     # 元音键文字（白色）
    bbs: 0xff283035      # 退格/Shift背景（暗灰）
    tbs: 0xffC8D6DF      # 退格/Shift文字（白色）
    bh1: 0xff384048      # 第1行按键背景（深灰）
    th1: 0xffC8D6DF      # 第1行按键文字（白色）
    bh2: 0xff384048      # 第2行按键背景
    th2: 0xffC8D6DF      # 第2行按键文字
    bh3: 0xff384048      # 第3行按键背景
    th3: 0xffC8D6DF      # 第3行按键文字
    bh4: 0xff384048      # 第4行按键背景
    th4: 0xffC8D6DF      # 第4行按键文字


#---------配色结束---------#

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "Chh"
  row: 6              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 40      #按键高度
  key_height_land: 40 #横屏模式按键高度
  single_width: 60    #single类型的按键宽度
  vertical_gap: 8     #纵向按键间隙
  margin_x: 5       #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - space1
      - BackSpace
      - Return2
      - clipboard_window
      - liquid_keyboard_tabs
  keyboards: [ascii, cn, list, unit, math, tabs, emoji_smiley, emoji_gesture, emoji_people, emoji_symbol, emoji_heart, emoji_plant, emoji_animal, emoji_food, emoji_travel]  #tab列表
  tabs:
    name: 更多
    type: TABS
  emoji_smiley:     #笑脸
    type: SINGLE
    name: 笑脸
